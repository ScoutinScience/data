# Site settings
title: "ScoutinScience Data"
description: "Catalog of ScoutinScience models, services and data stores: what goes in, what comes out, and how they connect."
baseurl: "/data"                       # repo name -> https://scoutinscience.github.io/data/
url: "https://scoutinscience.github.io"

# Theme (same Just the Docs theme as the UQ page, from its current home)
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

# Upper-right navigation
aux_links:
  "Propose a data source":
    - "https://github.com/ScoutinScience/data/issues/new?template=new-data-source.yml"

search_enabled: true
color_scheme: sis                  # _sass/color_schemes/sis.scss

# Company logo in the sidebar (served from scoutinscience.com; copy it to assets/images/ to host it here)
logo: "https://scoutinscience.com/logos/logo-new.svg"

# "Edit this page on GitHub" link at the bottom of every page
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/ScoutinScience/data"
gh_edit_branch: "Github-Pages"
gh_edit_source: docs
gh_edit_view_mode: "edit"

footer_content: "Maintained by ScoutinScience."
