# Entities: what each catalog category's data becomes in the platform.
# Used by the flow diagram on Home (Source → Entity → Project) and by the
# attribute tables on the category pages.
#
# attributes: every column of the entity's table.
#   required: true  → highlighted as obligatory for every source.

- id: grant
  name: Grant
  category: Grants
  url: /grants/
  table: Grants
  attributes:
    - { name: Title,               type: text,      required: true, description: "Title of the call" }
    - { name: Description,         type: text,      required: true, description: "Description of the call — the text we match on" }
    - { name: DeadlineDate,        type: date,      required: true, description: "Submission deadline" }
    - { name: Budget,              type: number,    required: true, description: "Funding available" }
    - { name: ExtendedDescription, type: text,      description: "Longer description, when the source has one" }
    - { name: Url,                 type: text,      description: "Link to the call at the source" }
    - { name: StartDate,           type: date,      description: "Start date of the call" }
    - { name: Status,              type: "enum (Open, Closed)", description: "Whether the call is open" }
    - { name: FunderId,            type: "uuid → Funders", description: "The funding body" }
    - { name: TopicId,             type: "→ OpenAlex topics", description: "Topic the grant is classified under" }
    - { name: EligibleTrl,         type: text,      description: "Eligible technology readiness level(s)" }
    - { name: ProjectId,           type: text,      description: "Identifier of the call — to confirm" }
    - { name: ExtraIdentifier,     type: text,      description: "Additional identifier — to confirm" }
    - { name: Embedding,           type: vector,    description: "Text embedding, generated after ingestion" }
    - { name: Id,                  type: uuid,      description: "Generated by the database" }
    - { name: CreatedDate,         type: date,      description: "Set by the database" }
    - { name: UpdatedDate,         type: date,      description: "Set by the database" }

- id: proposal
  name: Proposal
  category: Proposals
  url: /proposals/
  attributes:
    - { name: Title,     type: text, required: true, description: "Title of the proposal" }
    - { name: Text,      type: text, required: true, description: "Proposal narrative (full text or summary)" }
    - { name: Outcome,   type: text, required: true, description: "Funded, rejected, shortlisted… — or accept/reject for proxy papers" }
    - { name: Funder,    type: text, description: "Funder or venue" }
    - { name: Year,      type: int,  description: "Year of the call" }
    - { name: Reviews,   type: text, description: "Reviewer comments or reasons for the decision, when published" }
    - { name: License,   type: text, description: "Reuse terms of the record" }

- id: funded-project
  name: Funded project
  category: Funded projects
  url: /funded-projects/
  attributes:
    - { name: Title,     type: text,   required: true, description: "Project title" }
    - { name: Abstract,  type: text,   required: true, description: "Project abstract / objective" }
    - { name: Funder,    type: text,   required: true, description: "Funding agency or programme" }
    - { name: Amount,    type: number, description: "Amount awarded" }
    - { name: Year,      type: int,    description: "Start year" }
    - { name: Organisation, type: text, description: "Lead organisation / PI" }
    - { name: Topic,     type: text,   description: "Topic or field" }

- id: publication
  name: Publication
  category: Publications
  url: /publications/
  attributes: []

- id: patent
  name: Patent
  category: Patents
  url: /patents/
  attributes: []

- id: thesis
  name: Thesis
  category: Theses
  url: /theses/
  attributes:
    - { name: Title,             type: text,        required: true, description: "Title of the thesis" }
    - { name: Abstract,          type: text,        required: true, description: "Abstract (nullable in the table today)" }
    - { name: Author,            type: text,        required: true, description: "Author of the thesis" }
    - { name: ResearcherGroupId, type: "uuid → researcher groups", required: true, description: "Institution / research group the thesis belongs to" }
    - { name: Year,              type: int2,        required: true, description: "Year the degree was granted" }
    - { name: DegreeLevel,       type: text,        required: true, description: "PhD, master, bachelor or UAS" }
    - { name: ExtendedAbstract,  type: text,        description: "Longer abstract, when available" }
    - { name: AbstractSource,    type: text,        description: "Where the abstract was taken from" }
    - { name: Supervisors,       type: "text[]",    description: "Supervisors' names" }
    - { name: NSupervisors,      type: int4,        description: "Number of supervisors" }
    - { name: Subjects,          type: "text[]",    description: "Subject keywords" }
    - { name: TopicId,           type: text,        description: "Topic the thesis is classified under" }
    - { name: Language,          type: text,        description: "Language of the thesis" }
    - { name: Pages,             type: int4,        description: "Number of pages" }
    - { name: OpenAccess,        type: bool,        description: "Whether the full text is openly available" }
    - { name: FulltextUrl,       type: text,        description: "Link to the full text" }
    - { name: WorldcatUrl,       type: text,        description: "Link to the WorldCat record" }
    - { name: SourceString,      type: text,        description: "Raw source / citation string" }
    - { name: ExternalId,        type: text,        description: "Identifier at the source" }
    - { name: Id,                type: uuid,        description: "Generated by the database" }
    - { name: CreatedDate,       type: timestamptz, description: "Set by the database" }
    - { name: UpdatedDate,       type: timestamptz, description: "Set by the database" }
