# Entities: what each catalog category's data becomes in the platform.
# Used by the flow diagram on Home (Source → Entity → Project) and by the
# attribute tables on the category pages.
#
# attributes: every column of the entity's table.
#   required: true  → highlighted as obligatory for every source.

- id: grant
  name: Grant
  category: Grants
  url: /grants/
  table: Grants
  attributes:
    - { name: Title,               type: text,      required: true, description: "Title of the call" }
    - { name: Description,         type: text,      required: true, description: "Description of the call — the text we match on" }
    - { name: DeadlineDate,        type: date,      required: true, description: "Submission deadline" }
    - { name: Budget,              type: number,    required: true, description: "Funding available" }
    - { name: ExtendedDescription, type: text,      description: "Longer description, when the source has one" }
    - { name: Url,                 type: text,      description: "Link to the call at the source" }
    - { name: StartDate,           type: date,      description: "Start date of the call" }
    - { name: Status,              type: "enum (Open, Closed)", description: "Whether the call is open" }
    - { name: FunderId,            type: "uuid → Funders", description: "The funding body" }
    - { name: TopicId,             type: "→ OpenAlex topics", description: "Topic the grant is classified under" }
    - { name: EligibleTrl,         type: text,      description: "Eligible technology readiness level(s)" }
    - { name: ProjectId,           type: text,      description: "Identifier of the call — to confirm" }
    - { name: ExtraIdentifier,     type: text,      description: "Additional identifier — to confirm" }
    - { name: Embedding,           type: vector,    description: "Text embedding, generated after ingestion" }
    - { name: Id,                  type: uuid,      description: "Generated by the database" }
    - { name: CreatedDate,         type: date,      description: "Set by the database" }
    - { name: UpdatedDate,         type: date,      description: "Set by the database" }

- id: publication
  name: Publication
  category: Publications
  url: /publications/
  attributes: []

- id: patent
  name: Patent
  category: Patents
  url: /patents/
  attributes: []

- id: thesis
  name: Thesis
  category: Theses
  url: /theses/
  attributes: []
