# Labels used across the site. Change wording here; it updates every page.
# Colours live in _sass/custom/custom.scss.

kinds:
  model: Model
  service: Service
  library: Library
  intake: Data intake
  store: Data store

# status -> badge label and legend text (legend order = order here)
statuses:
  ok:
    label: "Served · persisting"
    legend: "Served and persisting output"
  warn:
    label: "No endpoint"
    legend: "No endpoint — in-process or library"
  stop:
    label: "Not integrated"
    legend: "Output not persisted or not integrated"
  store:
    label: "Store"
    legend: "Data store"
  active:
    label: "Active"
    legend: "Active data intake"
  candidate:
    label: "Candidate"
    legend: "Found, not in the pipeline yet"
  todo:
    label: "To document"
    legend: "Not documented yet"

# tier -> meaning (data-quality tiers used for GFS sources)
tiers:
  A: "Two-sided: proposal text with funded AND rejected outcomes"
  B: "Full proposal text, funded only (or no decision)"
  C: "Funded abstracts and metadata — base rates, no proposal text"
  D: "Proxy: conference papers with accept/reject, not grants"

# urgency -> badge label (for data that is missing but should be integrated)
urgency:
  high: "Urgent"
  medium: "Planned"
  low: "Later"

# Catalog categories, in the order they appear on Home.
categories: [Grants, Proposals, Funded projects, Publications, Patents, Theses, APIs, Scrapers, Fetch scripts, Storage]
